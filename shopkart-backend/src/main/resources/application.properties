spring.application.name=shopkart-backend
server.port=${PORT:8080}
#spring.datasource.url=${SHOPKART_DB_URL:jdbc:mysql://localhost:3306/shopkart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#spring.datasource.username=${SHOPKART_DB_USERNAME:root}
#spring.datasource.password=${SHOPKART_DB_PASSWORD}

spring.datasource.url=${SHOPKART_DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/shopkart?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${SHOPKART_DB_USERNAME}
spring.datasource.password=${SHOPKART_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.error.include-message=always
shopkart.upload-dir=uploads/profile-photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt.secret=${SHOPKART_JWT_SECRET}
app.jwt.expiration-ms=86400000
# Razorpay Test Mode
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SHOPKART_MAIL_USERNAME}
spring.mail.password=${SHOPKART_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true