
spring.application.name=shopkart-backend
server.port=${PORT:8080}

# TiDB Cloud Database
spring.datasource.url=${SHOPKART_DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/shopkart?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${SHOPKART_DB_USERNAME}
spring.datasource.password=${SHOPKART_DB_PASSWORD}

# HikariCP Connection Pool Optimization
spring.datasource.hikari.pool-name=ShopKartHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Error Handling
server.error.include-message=always



# File Upload
shopkart.upload-dir=uploads/profile-photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT
app.jwt.secret=${SHOPKART_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Razorpay Test Mode
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

mailjet.api-key=${MAILJET_API_KEY}
mailjet.secret-key=${MAILJET_SECRET_KEY}
mailjet.from-email=${MAILJET_FROM_EMAIL}

# Gmail SMTP Configuration
